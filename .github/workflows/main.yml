name: Meralda Call Automation (macOS)

on:
  push:
    branches: [ AddingGithubActions ]
  pull_request:
    branches: [ AddingGithubActions ]

jobs:
  run-tests:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Create AVD for Pixel_5
        run: |
          echo "no" | avdmanager create avd -n pixel5 -k "system-images;android-33;google_apis;x86_64" -d pixel
        env:
          ANDROID_SDK_ROOT: $HOME/Library/Android/sdk

      - name: 🚀 Start Emulator (macOS)
        run: |
          $HOME/Library/Android/sdk/emulator/emulator -avd pixel5 -no-snapshot -no-window -no-audio -gpu host > /tmp/emulator.log 2>&1 &
          echo "⏳ Waiting for emulator to boot..."
          adb wait-for-device
          adb shell 'while [[ $(getprop sys.boot_completed) != 1 ]]; do sleep 5; done;'
          echo "✅ Emulator booted"
        env:
          ANDROID_SDK_ROOT: $HOME/Library/Android/sdk

      - name: 🚀 Start Appium Server
        run: |
          npm install -g appium
          nohup appium > /tmp/appium.log 2>&1 &
          sleep 10

      - name: ✅ Make Shell Script Executable
        run: chmod +x ./run_both.sh

      - name: 🧪 Run Your Test Automation
        run: ./run_both.sh
