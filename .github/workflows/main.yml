name: Meralda Video Call Flow Test

on:
  push:
    branches: [" AddingGithubActions"]
  workflow_dispatch:

jobs:
  meralda-test:
    name: Run Emulator + Appium + Dual Script
    runs-on: macos-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create and Start Android Emulator
        run: |
          echo "Creating AVD..."
          echo "no" | avdmanager create avd -n testEmu -k "system-images;android-33;google_apis;x86_64" -d pixel_5 --force
          emulator -avd testEmu -no-audio -no-window -gpu swiftshader_indirect &
          adb wait-for-device
          adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done;'
          echo "✅ Emulator is ready."

      - name: Install Appium
        run: |
          npm install -g appium
          appium -v

      - name: Make .sh script executable
        run: chmod +x ./run_both.sh

      - name: Run Test Flow with Emulator and Appium
        run: ./run_both.sh

      - name: Archive Appium Logs (if needed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log
          path: /tmp/appium.log
