name: Meralda Call Automation

on:
  push:
    branches: [ AddingGithubActions ]
  pull_request:
    branches: [ AddingGithubActions ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🧰 Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: 📦 Install Android system image
        run: |
          sdkmanager "platform-tools" "emulator" "platforms;android-33" "system-images;android-33;google_apis;x86_64"

      - name: 🔍 Verify SDK installation
        run: sdkmanager --list

      - name: 📱 Create AVD (Pixel 5)
        run: |
          echo "no" | avdmanager create avd -n test_emulator -k "system-images;android-33;google_apis;x86_64" -d "pixel_5"
          cat ~/.android/avd/test_emulator.avd/config.ini

      - name: 🚀 Start Emulator (headless)
        run: |
          echo "📱 Starting emulator in background..."
          nohup emulator -avd test_emulator -no-audio -no-boot-anim -no-window -no-snapshot -no-accel -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          
          echo "🪵 Monitoring emulator log:"
          tail -f /tmp/emulator.log &

          echo "⏳ Waiting for emulator to boot..."
          adb wait-for-device
          adb shell 'while [[ $(getprop sys.boot_completed) != 1 ]]; do sleep 5; done;'
          echo "✅ Emulator booted"


      - name: 📦 Install Maven dependencies
        run: mvn clean install -DskipTests

      - name: ⬇️ Grant execute to shell script
        run: chmod +x run_both.sh

      - name: 🔬 Run Both Test Scripts
        run: ./run_both.sh

      
