name: Meralda Call Automation

on:
  push:
    branches: [AddingGithubActions]
  pull_request:
    branches: [AddingGithubActions]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Accept licenses and install tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "emulator" "platforms;android-33" "system-images;android-33;google_apis;x86_64"

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd -n test -k "system-images;android-33;google_apis;x86_64" -d pixel_5

      - name: Cold boot emulator in background
        run: |
          $ANDROID_SDK_ROOT/emulator/emulator -avd test -no-window -no-audio -no-boot-anim -gpu host &

      - name: Wait for emulator to boot
        run: |
          adb wait-for-device
          boot_completed=""
          until [[ "$boot_completed" == "1" ]]; do
            sleep 5
            boot_completed=$(adb shell getprop sys.boot_completed | tr -d '\r')
            echo "Waiting for emulator... boot_completed=$boot_completed"
          done
          echo "✅ Emulator is ready."

      - name: Grant necessary permissions
        run: adb shell pm grant your.package.name android.permission.CAMERA || true

      - name: Set executable permission for run_both.sh
        run: chmod +x run_both.sh

      - name: Run your test script
        run: ./run_both.sh
