name: Meralda calls with CodePush Tests

on:
  workflow_dispatch:
  push:
    branches:
      - AddingGithubActions
  pull_request:
    branches:
      - AddingGithubActions

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🌐 Set up Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: 🧰 Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: 📦 Accept SDK Licenses and Install Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "emulator" "platforms;android-33" "system-images;android-33;google_apis;x86_64"

      - name: 📱 Create AVD
        run: |
          echo "no" | avdmanager create avd -n pixel_33 -k "system-images;android-33;google_apis;x86_64" -d pixel

      - name: 🚀 Start Emulator in Headless Mode
        run: |
          nohup emulator -avd pixel_33 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          echo "⏳ Waiting for emulator to boot..."
          adb wait-for-device
          adb shell 'while [[ $(getprop sys.boot_completed) != 1 ]]; do sleep 5; done;'
          echo "✅ Emulator booted"

      - name: 🧪 Install Maven Dependencies
        run: mvn clean install -DskipTests

      - name: 🔐 Make Shell Script Executable
        run: chmod +x run_both.sh

      - name: 🎬 Run Automated Test (run_both.sh)
        run: ./run_both.sh
        
