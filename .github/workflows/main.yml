name: Meralda Calls Automation

on:
  workflow_dispatch:
  push:
    branches:
      - AddingGithubActions
  pull_request:
    branches:
      - AddingGithubActions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🌐 Set up Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: 🧰 Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: 📦 Accept Licenses and Install System Images
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "emulator" "platforms;android-33" "system-images;android-33;google_apis;x86_64"

      - name: 📱 Create AVD
        run: echo "no" | avdmanager create avd -n test_emulator -k "system-images;android-33;google_apis;x86_64" -d pixel

      - name: 🚀 Start Emulator with xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          echo "📦 Installed xvfb"

          nohup xvfb-run emulator -avd test_emulator -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > /tmp/emulator.log 2>&1 &
          echo "⏳ Waiting for emulator to boot..."
          adb wait-for-device
          adb shell 'while [[ $(getprop sys.boot_completed) != 1 ]]; do sleep 5; done;'
          echo "✅ Emulator booted"

      - name: 🧪 Install Maven Dependencies
        run: mvn clean install -DskipTests

      - name: 🔐 Make run_both.sh Executable
        run: chmod +x run_both.sh

      - name: 🎬 Run Test Script
        run: ./run_both.sh
